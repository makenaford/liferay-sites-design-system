# Builds Storybook and publishes it to GitHub Pages at https://makenaford.github.io/liferay-sites-design-system/
#
# Ported from the workflow that shipped with the previous plain-React library in this repo, with
# three changes: the package is now at the repo root rather than in a design-system/ subdirectory,
# the toolchain is pnpm rather than npm, and the deploy uses GitHub's own Pages actions — this
# repository's Pages source is set to "GitHub Actions", so publishing to a gh-pages branch would
# build successfully and then never be served.
name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by actions/deploy-pages.
  pages: write
  id-token: write

# A superseded run has nothing useful to publish, so cancel it rather than racing the newer one.
concurrency:
  group: deploy-storybook
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the "engines" field in package.json.
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile resolves from pnpm-lock.yaml, so the minimumReleaseAge policy in
      # pnpm-workspace.yaml cannot fail the build on a version that was fine locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails if src/theme/*.generated.* no longer match tokens/figma/ — i.e. someone edited a
      # generated file by hand, or replaced a Figma export without running `pnpm tokens`.
      - name: Check tokens are in sync
        run: pnpm tokens:check

      # Same for the icon set: fails if src/icons/generated.tsx no longer matches manifest.json.
      - name: Check icons are in sync
        run: pnpm icons:check

      # And the illustrative set: fails if src/icons/glass.generated.tsx no longer matches
      # glass-manifest.json, or if an SVG in assets/glass-icons/ changed without regenerating.
      - name: Check glass icons are in sync
        run: pnpm glass-icons:check

      - name: Typecheck
        run: pnpm typecheck

      # Browsers are not in the lockfile — they live in a shared cache and are fetched on demand.
      # `--with-deps` pulls the system libraries a headless Chromium needs on a bare runner.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Structural checks over every story: no horizontal overflow at 375/768/1440 in both colour
      # schemes, and nothing throwing while it renders. Runs before the build, so a layout regression
      # fails the run rather than shipping to Pages.
      - name: Layout tests
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
